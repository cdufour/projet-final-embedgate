# gateway.ini : configuration de référence (INTERFACES.md §3).
# Les vérifications utilisent CE fichier : ne changez pas les seuils ici,
# faites-en une copie pour vos essais. Changez seulement `groupe`.
# Commentaires : seulement sur une ligne à part, commençant par #.

[passerelle]
# groupe : gp1 ... gp6, préfixe de vos topics MQTT
groupe    = gp1
journal   = embedgate.log
bus       = /tmp/embedgate_bus.bin

[mqtt]
hote = 127.0.0.1
port = 1883

[canal.0]
nom        = temperature
unite      = degC
facteur    = 0.001
bas        = 0.0
haut       = 8.0
hysteresis = 1.0

[canal.1]
nom        = pression
unite      = mbar
facteur    = 0.001
bas        = 1000.0
haut       = 1025.0
hysteresis = 2.0

[canal.2]
nom        = courant
unite      = mA
facteur    = 0.001
bas        = 0.0
haut       = 900.0
hysteresis = 20.0

[canal.3]
nom        = porte
unite      = bool
facteur    = 1
bas        = -1
haut       = 0.5
hysteresis = 0
