server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Derrière le proxy HTTPS de Dokploy : redirections relatives
    # (/embedgate → /embedgate/ sans http:// ni port interne).
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /embedgate { return 301 /embedgate/; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
